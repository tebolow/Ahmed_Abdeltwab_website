<main class="container">
  <section class="form-card" aria-labelledby="contact-title">
    <div class="contact-header">
      <span class="section-pill">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <rect width="20" height="16" x="2" y="4" rx="2" />
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
        </svg>
        Let's Connect
      </span>
      <h1 id="contact-title">Send a Message</h1>
      <p class="subtitle">Have a project in mind or want to collaborate? Drop me a note below.</p>
    </div>

    @if (siteData?.email || siteData?.phone) {
      <div class="quick-info">
        @if (siteData?.email) {
          <div class="info-pill">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <rect width="20" height="16" x="2" y="4" rx="2" />
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
            </svg>
            <span>{{ siteData.email }}</span>
          </div>
        }
        @if (siteData?.phone) {
          <div class="info-pill">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z" />
            </svg>
            <span>{{ siteData.phone }}</span>
          </div>
        }
      </div>
    }

    @if (statusMessage) {
      <div class="status-banner" [class.error]="isError" [class.success]="!isError" role="status" aria-live="polite">
        {{ statusMessage }}
      </div>
    }

    <form method="POST" class="contactForm" (submit)="addContact($event)">
      <div class="field">
        <label for="c-name">Name <span aria-hidden="true">*</span></label>
        <input id="c-name" type="text" name="name" autocomplete="name" placeholder="Your name" required />
      </div>

      <div class="field">
        <label for="c-email">Email <span aria-hidden="true">*</span></label>
        <input id="c-email" type="email" name="email" autocomplete="email" placeholder="you@example.com" required />
      </div>

      <div class="field">
        <label for="c-phone">Phone Number <span aria-hidden="true">*</span></label>
        <input id="c-phone" type="tel" name="phone" autocomplete="tel" placeholder="+20..." required />
      </div>

      <div class="field">
        <label for="c-message">Message <span aria-hidden="true">*</span></label>
        <textarea id="c-message" name="message" rows="5" placeholder="How can I help?" required></textarea>
      </div>

      <button type="submit" class="submitButton" [disabled]="isSubmitting">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="m22 2-7 20-4-9-9-4Z" />
          <path d="M22 2 11 13" />
        </svg>
        <span>{{ isSubmitting ? 'Sending...' : 'Send Message' }}</span>
      </button>
    </form>
  </section>
</main>

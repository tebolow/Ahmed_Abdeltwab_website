<header class="site-header">
  <div class="header-inner">
    <a class="logo" routerLink="/home" (click)="closeMenu()" aria-label="Portfolio Home">
      @if (data?.data?.logo) {
        <img [src]="data.data.logo | mediaUrl" [alt]="(data.data.name || 'Portfolio') + ' logo'" />
      } @else {
        <span class="logo-text">Portfolio</span>
      }
    </a>

    <div class="header-actions">
      <button
        type="button"
        class="icon-btn"
        (click)="theme.toggleTheme()"
        [attr.aria-label]="theme.currentTheme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
        title="Toggle color theme"
      >
        @if (theme.currentTheme() === 'dark') {
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
          </svg>
        } @else {
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        }
      </button>

      <button
        type="button"
        class="menu-toggle"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen"
        aria-controls="portfolio-primary-nav"
        aria-label="Toggle navigation menu"
      >
        <span>{{ menuOpen ? 'Close' : 'Menu' }}</span>
      </button>
    </div>

    <nav id="portfolio-primary-nav" class="nav_links" [class.open]="menuOpen" aria-label="Primary navigation">
      <a routerLink="/home" routerLinkActive="active" (click)="closeMenu()">Home</a>
      <a routerLink="/portfolio" routerLinkActive="active" (click)="closeMenu()">Portfolio</a>
      <a routerLink="/about" routerLinkActive="active" (click)="closeMenu()">About</a>
      <a routerLink="/contact" routerLinkActive="active" (click)="closeMenu()">Contact</a>

      <div class="vertical_splitter" aria-hidden="true"></div>

      @if (data?.data?.cv) {
        <a class="downloadCV" [href]="downloadCvUrl" download>Download CV</a>
      }
    </nav>
  </div>
</header>

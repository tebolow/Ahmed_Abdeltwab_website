<footer class="container">
  <div class="getInTouch">Get in touch</div>
  <p class="lead">
    What’s next? Feel free to reach out if you are looking for a developer, have a query, or simply want to connect.
  </p>

  @if (data?.data?.email) {
    <div class="iconWithText">
      <p>{{ data.data.email }}</p>
      <button type="button" class="copy-btn" (click)="copyText(data.data.email, 'email')">
        {{ copiedField === 'email' ? 'Copied' : 'Copy' }}
      </button>
    </div>
  }

  @if (data?.data?.phone) {
    <div class="iconWithText">
      <p>{{ data.data.phone }}</p>
      <button type="button" class="copy-btn" (click)="copyText(data.data.phone, 'phone')">
        {{ copiedField === 'phone' ? 'Copied' : 'Copy' }}
      </button>
    </div>
  }

  <p class="lead">You may also find me on these platforms!</p>
  <app-socials></app-socials>
</footer>
